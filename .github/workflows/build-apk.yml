name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Mobile Web Assets
        working-directory: frontend
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Unsigned)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs for Artifacts
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/openGym-debug.apk
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk dist-apk/openGym-release-unsigned.apk
          sha256sum dist-apk/*.apk > dist-apk/SHA256SUMS.txt
          cat dist-apk/SHA256SUMS.txt

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openGym-android-apks
          path: dist-apk/*
          retention-days: 30
